plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    //CC:Tweaked fabric
    modCompileOnly("cc.tweaked:cc-tweaked-$rootProject.minecraft_version-fabric-api:$rootProject.cc_tweaked_version")
    modRuntimeOnly("cc.tweaked:cc-tweaked-$rootProject.minecraft_version-fabric:$rootProject.cc_tweaked_version")

    //HexCasting fabric
    modImplementation(files("libs/hexcasting-fabric-$rootProject.minecraft_version-${rootProject.hexcasting_version}.jar"))

    //HexCasting dependencies
    modRuntimeOnly("at.petra-k:paucal:$rootProject.paucal_version+$rootProject.minecraft_version-fabric")
    modRuntimeOnly("vazkii.patchouli:Patchouli:1.21-$rootProject.patchouli_version-FABRIC-SNAPSHOT")
    modRuntimeOnly("com.samsthenerd.inline:inline-fabric:$rootProject.minecraft_version-$rootProject.inline_version")
    modRuntimeOnly("org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.fabric_cardinal_components_version")
    modRuntimeOnly("org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.fabric_cardinal_components_version")
    modRuntimeOnly("org.ladysnake.cardinal-components-api:cardinal-components-item:$rootProject.fabric_cardinal_components_version")
    modRuntimeOnly("org.ladysnake.cardinal-components-api:cardinal-components-block:$rootProject.fabric_cardinal_components_version")
    modRuntimeOnly("net.fabricmc:fabric-language-kotlin:$rootProject.fabricLanguageKotlinVersion")
    modRuntimeOnly("net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version")

    //Inline dependencies
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version")
    modRuntimeOnly("dev.architectury:architectury-fabric:$architecturyVersion")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
