plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    //CC:Tweaked forge
    compileOnly("cc.tweaked:cc-tweaked-$rootProject.minecraft_version-core-api:$rootProject.cc_tweaked_version")
    modCompileOnly("cc.tweaked:cc-tweaked-$rootProject.minecraft_version-forge-api:$rootProject.cc_tweaked_version")
    modRuntimeOnly("cc.tweaked:cc-tweaked-$rootProject.minecraft_version-forge:$rootProject.cc_tweaked_version")

    //Workaround for https://github.com/architectury/architectury-loom/issues/201
    //https://github.com/cc-tweaked/CC-Tweaked/discussions/1752#discussioncomment-8846393
    forgeRuntimeLibrary "cc.tweaked:cobalt:0.9.7"
    forgeRuntimeLibrary "com.jcraft:jzlib:1.1.3"
    forgeRuntimeLibrary "io.netty:netty-codec-http:4.1.82.Final"
    forgeRuntimeLibrary "io.netty:netty-codec-socks:4.1.82.Final"
    forgeRuntimeLibrary "io.netty:netty-handler-proxy:4.1.82.Final"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
